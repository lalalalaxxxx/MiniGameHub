<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c3e8e4"><meta name="apple-mobile-web-app-capable" content="yes">
<title>小鸟爆破 · 软软游戏屋</title>
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="manifest" href="../../manifest.webmanifest"><link rel="stylesheet" href="../../assets/css/bird.css">
</head><body data-game="birdblast">
<header><a href="../../index.html">‹ 回大厅</a><h1>小鸟爆破<small>BIRD BLAST · 森林合唱团</small></h1><button id="sound" aria-pressed="false">开启声音</button></header>
<main>
  <section class="play-panel" aria-label="游戏区域"><div class="stage"><div class="board-wrap">
    <canvas id="board" width="700" height="1100" aria-hidden="true"></canvas>
    <div id="cells" class="hit-grid" role="group" aria-label="小鸟棋盘"></div>
    <div id="overlay" class="overlay"><span class="badge" aria-hidden="true">✦</span><h2 id="overlay-title">森林合唱团</h2><p id="overlay-text">拖动小鸟，连起三个同色伙伴。再快加一只，就能合成超能小鸟！</p><button id="resume">开始游戏</button></div>
  </div></div><p id="feedback" role="status" aria-live="polite">三只相连，抖一抖，再一起爆破！</p></section>
  <aside class="side" aria-label="游戏控制">
    <div class="intro"><span class="eyebrow">A LITTLE FOREST, A BIG COMBO</span><h2 id="mode-title">经典挑战</h2><p id="mode-note">抓住露出上方或侧边的小鸟，拖到空位。爆破时也能继续操作。</p></div>
    <div class="pickers"><label>玩法<select id="mode" aria-label="游戏模式"><option value="classic">经典挑战</option><option value="ice">顶部投放 · 破冰</option><option value="pandora">潘多拉宝盒</option><option value="practice">轻松练习</option><option value="fever">狂热冲分</option></select></label><label>节奏<select id="pace" aria-label="游戏节奏"><option value="gentle">悠闲节奏</option><option value="normal">经典节奏</option></select></label></div>
    <div class="stats"><div class="stat"><span>本局得分</span><strong id="score">0</strong></div><div class="stat"><span id="level-label">森林等级</span><strong id="level">1</strong></div><div class="stat wide"><span id="clock-label">下一排小鸟</span><strong id="clock">—</strong><div class="meter"><i id="progress"></i></div></div></div>
    <div class="powers" aria-label="超能小鸟合成"><span><b>✦</b>4只 · 发光</span><span><b>♨</b>5只 · 燃火</span><span><b>ϟ</b>6只 · 闪电</span><span><b>◎</b>7只 · 黑洞</span></div>
    <div class="actions"><button id="pause" class="primary">开始</button><button id="hint">提示</button><button id="shuffle">重排</button><button id="restart">重来</button><button id="help">玩法</button></div>
    <p class="bottom-tip" id="best">留一点空位，给连锁留一点可能。</p>
  </aside>
</main>
<footer><span>自由拖动 · 连锁爆破 · 离线可玩</span><span id="save-status">进度自动保存</span></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="dialog-actions"><button id="cancel">继续玩</button><button id="confirm" class="primary">确定</button></div></dialog>
<script src="../../assets/js/audio.js"></script><script src="../../assets/js/bird-core.js"></script><script src="../../assets/js/bird-ui.js"></script><script src="../../assets/js/offline.js"></script>
</body></html>
