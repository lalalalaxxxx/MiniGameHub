<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <meta name="format-detection" content="telephone=no">
  <title>贪吃蛇 · 软软游戏屋</title>
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png">
  <link rel="manifest" href="../../manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="&#36719;&#36719;&#28216;&#25103;&#23627;">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/game.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html">回大厅</a>
    <h1>贪吃蛇</h1>
    <div class="scores">
      <p class="score">得分 <strong id="score">0</strong></p>
      <p class="score">最高 <strong id="best">0</strong></p>
    </div>
  </header>
  <div class="actions">
    <button type="button" id="pause" class="ghost" disabled>暂停</button>
    <button type="button" id="restart" class="ghost">重来</button>
    <button type="button" id="sound" class="ghost" aria-pressed="true">声音</button>
  </div>
  <div class="stage">
    <p class="hint" id="hint">上下左右滑动，带小蛇吃果子</p>
    <div class="fit">
      <div class="square" id="boardWrap">
        <canvas id="board" width="600" height="600"></canvas>
      </div>
    </div>
    <div class="pad" aria-label="方向">
      <button type="button" class="up" data-dir="0,-1" aria-label="向上">↑</button>
      <button type="button" class="left" data-dir="-1,0" aria-label="向左">←</button>
      <button type="button" class="down" data-dir="0,1" aria-label="向下">↓</button>
      <button type="button" class="right" data-dir="1,0" aria-label="向右">→</button>
    </div>
  </div>
  <div id="overlay" class="overlay" hidden>
    <div class="dialog" role="alertdialog" aria-labelledby="overlay-title">
      <h2 id="overlay-title">再来一次</h2>
      <p id="overlay-text">再试一次吧。</p>
      <button type="button" class="primary" id="again">再玩一次</button>
    </div>
  </div>
  <script src="../../assets/js/swipe.js"></script>
  <script src="../../assets/js/audio.js"></script>
  <script src="game.js"></script>
  <script src="../../assets/js/offline.js"></script>
</body>
</html>
