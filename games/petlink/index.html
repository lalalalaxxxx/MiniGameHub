<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e4eee5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>宠物连连看 · 软软游戏屋</title>
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="stylesheet" href="../../assets/css/match.css">
<link rel="stylesheet" href="../../assets/css/petlink.css">
</head>
<body data-game="petlink">
<header>
  <a href="../../index.html"><span aria-hidden="true">‹</span> 回大厅</a>
  <div class="game-heading"><span class="eyebrow">LITTLE PAWS CLUB</span><h1>宠物连连看</h1></div>
  <button id="sound" type="button" aria-pressed="false">开启声音</button>
</header>
<div class="toolbar">
  <div class="pickers"><label class="level-picker"><span>关卡</span><select id="levels" aria-label="选择关卡"></select></label><select id="mode" aria-label="游戏模式"><option value="timed">计时挑战</option><option value="practice">慢慢练习</option></select></div>
  <div class="toolbar-actions"><button id="pause" type="button">▶ 开始</button><button id="restart" type="button">重来</button><button id="help" type="button">玩法</button></div>
</div>
<main class="match-layout">
  <section class="play-panel" aria-label="连连看游戏区域">
    <div class="pet-goals"><span>🐾 配对 <strong id="pairs">0 / 12</strong></span><span id="flow">原地不动</span><span id="combo">找到好朋友</span></div>
    <div class="board-stage"><div class="board-wrap">
      <canvas id="board" width="800" height="600" aria-hidden="true"></canvas>
      <div id="cells" class="hit-grid" role="group" aria-label="宠物棋盘"></div>
      <div id="board-message" aria-hidden="true"></div>
      <button id="resume" type="button"><span>🐾</span><strong>准备好了吗？</strong><small>点这里开始</small></button>
    </div></div>
    <p id="feedback" role="status" aria-live="polite">找到相同宠物，用不超过两个拐角的路线连起来。</p>
  </section>
  <aside class="match-side" aria-label="关卡进度">
    <div class="level-summary"><span class="chapter-label">两只小伙伴 · 一条相遇的路</span><h2 id="level-title">初次见面</h2><p id="level-note">从外面开始找，也可以绕过棋盘边缘。</p></div>
    <div class="pet-side-art" aria-hidden="true">🐾 <span>♡</span> 🐾</div>
    <div class="pet-clock"><div><span id="clock-label">剩余时间</span><strong id="timer">100 秒</strong></div><div class="time-track" role="progressbar" aria-label="剩余时间" aria-valuemin="0" aria-valuemax="100"><i id="time-fill"></i></div></div>
    <div class="pet-score"><span>本关得分</span><strong id="score">0</strong><small id="best">最好 0</small></div>
    <div class="game-actions"><button id="hint" type="button">提示 · 3</button><button id="shuffle" type="button">重排 · 3</button><button id="undo" type="button">撤回</button></div>
    <p class="side-tip">最多两个拐角，也能从外围绕行。<br>没有配对时，会免费自动重排。</p>
    <section id="result" hidden aria-labelledby="result-title"><div class="result-star" aria-hidden="true">✦</div><h2 id="result-title">都找到好朋友啦！</h2><p id="result-text"></p><div class="result-actions"><button id="next" class="primary" type="button">下一关 →</button><button id="retry" type="button">再玩一次</button><button id="result-undo" type="button">撤回一步</button></div></section>
  </aside>
</main>
<footer><span class="footer-label">慢慢观察 · 快乐配对</span><span id="save-status">进度会自动保存</span></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="dialog-actions"><button id="cancel" type="button">继续玩</button><button id="confirm" class="primary" type="button">确定</button></div></dialog>
<script src="../../assets/js/audio.js"></script>
<script src="../../assets/js/petlink-core.js"></script>
<script src="../../assets/js/petlink-art.js"></script>
<script src="../../assets/js/petlink-ui.js"></script>
<script src="../../assets/js/offline.js"></script>
</body>
</html>
