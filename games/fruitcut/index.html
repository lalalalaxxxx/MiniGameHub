<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#143d3b"><title>西瓜切切乐 · 软软游戏屋</title><link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png"><link rel="manifest" href="../../manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="game.css"></head>
<body><header><a href="../../index.html">‹ 回大厅</a><div><span>划一划 · 果汁飞溅</span><h1>西瓜切切乐</h1></div><button id="sound">开启声音</button></header>
<main><div class="toolbar"><nav aria-label="游戏模式"><button data-mode="relax" aria-pressed="true">🍉 开心切 · 无炸弹</button><button data-mode="challenge" aria-pressed="false">⚡ 经典挑战</button></nav><div class="tools"><button id="pause" disabled>暂停</button><button id="restart">开始游戏</button></div></div>
<section class="scoreboard" aria-label="游戏成绩"><div>本局得分<strong id="score">0</strong></div><div>剩余时间<strong><span id="time">60</span><small>秒</small></strong></div><div>最高纪录<strong id="best">0</strong></div><div id="stat-label">切中水果<strong id="stat">0</strong></div></section>
<div id="arena"><canvas id="game" tabindex="0" aria-label="水果切割区域：用手指滑过水果，也可以使用鼠标按住拖动。">请使用支持 Canvas 的浏览器玩这个游戏。</canvas><div id="overlay"><div class="panel"><div class="melon-badge" aria-hidden="true">🍉</div><p class="eyebrow">夏日果园营业啦</p><h2 id="overlay-title">手指就是小小刀光</h2><p id="overlay-text">按住并划过飞起的水果。每个水果 10 分，一划连切还有奖励！开心切没有炸弹，漏掉水果也不扣分。</p><button id="play" class="primary">开始切水果</button></div></div><div id="toast" role="status"></div></div>
<footer><p id="hint">滑动切水果，点一下不会切开 · 可以用多根手指一起玩</p><span id="save-status">两种模式分别记录最高分</span></footer></main>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">重新开始吗？</h2><p>这局还没结束，现在的成绩会保存为纪录，再开始一局。</p><div><button id="cancel">继续这局</button><button id="confirm" class="primary">重新开始</button></div></dialog>
<script src="../../assets/js/audio.js"></script><script src="engine.js"></script><script src="game.js"></script><script src="../../assets/js/offline.js"></script></body></html>
