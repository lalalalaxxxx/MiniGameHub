<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d0e9e6"><meta name="apple-mobile-web-app-capable" content="yes"><title>停车场挪车 · 软软游戏屋</title><link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png"><link rel="manifest" href="../../manifest.webmanifest"><link rel="stylesheet" href="../../assets/css/extra.css"></head>
<body data-game="trafficpark"><header><a href="../../index.html">‹ 回大厅</a><h1>停车场挪车<small>LITTLE PLAY · 大大的好奇心</small></h1><button id="sound" aria-pressed="false">开启声音</button></header>
<main><section class="play-panel" aria-label="游戏区域"><div class="stage"><div class="canvas-wrap"><canvas id="board" width="720" height="800" tabindex="0" aria-label="停车场挪车游戏画面。横车横着走，竖车竖着走，帮红色小车开出出口。"></canvas><div class="overlay" id="overlay"><span class="badge" aria-hidden="true">✦</span><h2 id="overlay-title">停车场挪车</h2><p id="overlay-text">横车横着走，竖车竖着走，帮红色小车开出出口。</p><div class="result-actions"><button id="resume">开始游戏</button><button id="retry" hidden>再练这一关</button></div></div></div></div><p id="feedback" role="status" aria-live="polite">横车横着走，竖车竖着走，帮红色小车开出出口。</p></section>
<aside class="side" aria-label="游戏控制"><div class="intro"><span class="eyebrow">SMALL STEPS, HAPPY DISCOVERIES</span><h2 id="mode-title">第 1 关</h2><p id="mode-note">横车横着走，竖车竖着走，帮红色小车开出出口。</p></div><label class="level-picker">关卡<select id="levels" aria-label="选择关卡"></select></label><div class="stats"><div class="stat"><span id="score-label">得分</span><strong id="score">0</strong></div><div class="stat"><span id="count-label">本关记录</span><strong id="count">0</strong></div><div class="stat wide"><span id="target-label">目标</span><strong id="target">准备出发</strong><div class="meter"><i id="progress"></i></div></div></div><div id="mechanisms" class="mechanisms" aria-label="游戏操作与道具"></div><div class="actions"><div class="action-row"><button id="pause">暂停</button><button id="hint">提示</button><button id="undo">撤销</button><button id="restart">重来</button><button id="help">玩法</button></div></div><p id="best" class="bottom-note">每次尝试都有新发现</p></aside></main>
<footer><span>十个关卡 · 触摸操作 · 离线可玩</span><span id="save-status">进度自动保存</span></footer><dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="dialog-actions"><button id="cancel">继续玩</button><button id="confirm" class="primary">确定</button></div></dialog><script src="../../assets/js/audio.js"></script><script src="../../assets/js/extras/trafficpark.js"></script><script src="../../assets/js/extra-shell.js"></script><script src="../../assets/js/offline.js"></script></body></html>
