<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <meta name="format-detection" content="telephone=no">
  <title>俄罗斯方块 · 软软游戏屋</title>
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/apple-touch-icon.png">
  <link rel="manifest" href="../../manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="&#36719;&#36719;&#28216;&#25103;&#23627;">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/game.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html">回大厅</a>
    <h1>俄罗斯方块</h1>
    <div class="scores">
      <p class="score">得分 <strong id="score">0</strong></p>
      <p class="score">最高 <strong id="best">0</strong></p>
    </div>
  </header>

  <div class="actions">
    <button type="button" id="pause" class="ghost">暂停</button>
    <button type="button" id="restart" class="ghost">重来</button>
    <button type="button" id="sound" class="ghost" aria-pressed="true">声音</button>
  </div>

  <main class="stage">
    <p class="hint" id="hint">左右滑动移动 · 上滑或轻点旋转 · 下滑落到底</p>
    <div class="game-area">
      <div class="board-shell">
        <canvas id="board" width="300" height="600" aria-label="10列20行俄罗斯方块棋盘"></canvas>
      </div>
      <aside class="side-card" aria-label="游戏信息">
        <section>
          <span>下一块</span>
          <canvas id="next" width="120" height="120" aria-label="下一块预览"></canvas>
        </section>
        <p>等级 <strong id="level">1</strong></p>
        <p>消行 <strong id="lines">0</strong></p>
      </aside>
    </div>

    <div class="controls" aria-label="方块控制">
      <button type="button" data-action="left" aria-label="向左移动">←</button>
      <button type="button" data-action="rotate" aria-label="顺时针旋转">&#8635;</button>
      <button type="button" data-action="right" aria-label="向右移动">→</button>
      <button type="button" class="drop" data-action="drop" aria-label="直接落到底">↓</button>
    </div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="dialog" role="alertdialog" aria-labelledby="overlay-title">
      <h2 id="overlay-title">方块装满啦</h2>
      <p id="overlay-text">已经很棒啦，再来挑战一次吧！</p>
      <button type="button" class="primary" id="again">再玩一次</button>
    </div>
  </div>

  <script src="../../assets/js/swipe.js"></script>
  <script src="game.js"></script>
</body>
</html>
