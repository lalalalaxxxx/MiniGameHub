<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#faf7ef"><meta name="apple-mobile-web-app-capable" content="yes"><title>玩具城堡塔防 · 软软游戏屋</title><link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png"><link rel="manifest" href="../../manifest.webmanifest"><link rel="stylesheet" href="../../assets/css/defense.css"><link rel="stylesheet" href="../../assets/css/screen-fit.css"></head>
<body data-game="toydefense"><header><a href="../../index.html">‹ 回大厅</a><div><span>小小策略家 · 一起守护</span><h1>玩具城堡塔防</h1></div><button id="sound">开启声音</button></header>
<div class="toolbar"><label class="difficulty">玩法 <select id="difficulty"><option value="easy">轻松守护</option><option value="normal">小小挑战</option></select></label><div class="tools"><button id="help">怎么玩</button><button id="restart">重新开始</button></div></div>
<main><div class="defense-layout"><section class="battle-card"><div class="stats" aria-label="本轮状态"><span id="coins"></span><span id="hearts"></span><span id="wave"></span></div><h2>弯弯小路旁，搭起玩具塔</h2><div class="field-labels"><span>↘ 上方左侧出发</span><span>🏰 下方右侧是城堡</span></div><div class="battlefield" aria-label="弯曲道路塔防地图"><div id="cells" class="cells"></div><svg id="actors" viewBox="0 0 800 500" aria-hidden="true"></svg><div id="veil" class="pause-veil" hidden><span>已经暂停 ☁️</span></div></div><div class="battle-buttons"><button id="start" class="primary">开始守护</button><button id="pause">暂停</button><button id="speed">速度 1×</button></div><p id="wave-note" class="wave-note"></p><div id="finish" class="finish-box" role="status" hidden></div></section>
<aside class="defense-side"><h2>选择守护塔</h2><div id="choices" class="tower-choices"></div><div id="inspector" class="inspector"></div><p class="note">🧩 塔放在草地上，小熊沿沙色道路前进。选择已有塔可查看攻击范围。<br>没有建造倒计时，每波结束都能慢慢准备。</p></aside></div></main>
<footer><p id="feedback" role="status"></p><span id="save-status"></span></footer><dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div><button id="cancel">继续玩</button><button id="confirm" class="primary">确定</button></div></dialog><script src="../../assets/js/defense-core.js"></script><script src="../../assets/js/audio.js"></script><script src="../../assets/js/defense-fx.js"></script><script src="../../assets/js/defense-ui.js"></script><script src="../../assets/js/offline.js"></script><script src="../../assets/js/screen-fit.js"></script></body></html>
